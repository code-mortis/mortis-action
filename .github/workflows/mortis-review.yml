name: Mortis PR review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # Coarse event filter before allocating a runner. The Action parses commands
    # exactly and checks the caller's current repository permission.
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.sender.login != 'dependabot[bot]' &&
       (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.type == 'User' && contains(github.event.comment.body, '/mortis '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
      # Enable with check-linked-issues.
      # issues: read
    concurrency:
      group: mortis-review-${{ github.event.pull_request.number || github.event.issue.number }}
      queue: max
    steps:
      - uses: code-mortis/mortis-action@18ea3af2b07679bdc77df49b0016a4e826114dec # v0.2.4
        id: mortis
        with:
          provider: opencode-go
          protocol: openai-responses
          base-url: https://opencode.ai/zen/go/v1
          model: ${{ vars.MORTIS_MODEL }}
          review-forks: ${{ vars.MORTIS_REVIEW_FORKS }}
          # auto-describe: "true"
          # Check up to six requirements with the configured provider.
          # check-linked-issues: "true"
        env:
          MORTIS_API_KEY: ${{ secrets.MORTIS_API_KEY }}
          MORTIS_STATE_KEY: ${{ secrets.MORTIS_STATE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && vars.MORTIS_UPLOAD_REPORTS == 'true' && steps.mortis.outputs.report-json != '' }}
        with:
          name: mortis-review-${{ github.run_attempt }}
          path: |
            ${{ steps.mortis.outputs.report-json }}
            ${{ steps.mortis.outputs.report-markdown }}
          retention-days: 7
          if-no-files-found: error
